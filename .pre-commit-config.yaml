repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.7.0
          - pydantic-settings>=2.2.0
          - httpx>=0.27.0
          - pytest>=8.0.0
          - faker>=24.0.0
          - respx>=0.21.0
          - structlog>=24.1.0
        pass_filenames: false
        args: []
