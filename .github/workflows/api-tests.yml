name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PAGES_RETAIN_RUNS: "20"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install Allure CLI
        run: npm install -g allure-commandline --save-dev

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: pytest --alluredir=allure-results

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Allure report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report

      - name: Upload raw Allure results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results

      - name: Record run timestamp
        if: always() && github.event_name != 'pull_request'
        id: timestamp
        run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout existing gh-pages branch
        uses: actions/checkout@v4
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Ensure gh-pages working copy exists
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ ! -d gh-pages/.git ]; then
            rm -rf gh-pages
            mkdir -p gh-pages
            cd gh-pages
            git init -q
            git checkout -q -b gh-pages
          fi

      - name: Merge this run's report into the Pages site
        if: always() && github.event_name != 'pull_request'
        run: |
          python3 scripts/build_pages_site.py \
            --site-dir gh-pages \
            --report-dir allure-report \
            --run-number "${{ github.run_number }}" \
            --sha "${{ github.sha }}" \
            --actor "${{ github.actor }}" \
            --event "${{ github.event_name }}" \
            --repo "${{ github.repository }}" \
            --timestamp "${{ steps.timestamp.outputs.now }}" \
            --retain "${{ env.PAGES_RETAIN_RUNS }}"

      - name: Upload Allure report for Pages
        uses: actions/upload-pages-artifact@v3
        if: always() && github.event_name != 'pull_request'
        with:
          path: gh-pages

      - name: Publish gh-pages branch
        if: always() && github.event_name != 'pull_request'
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Allure report for run #${{ github.run_number }}" || echo "Nothing to commit"
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin HEAD:gh-pages

  deploy-pages:
    needs: test
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add report link to job summary
        run: |
          echo "### 📊 Allure Report" >> "$GITHUB_STEP_SUMMARY"
          echo "[Latest run](${{ steps.deployment.outputs.page_url }}latest/index.html) · [Browse all runs](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
